# Logs in (only when the login screen is showing). Needs: APP_ID, LINK_BASE, KH_USER, KH_PASS (see e2e/README.md).
# Works in any app language: the steps use fixed test IDs, not the words on the screen.
appId: ${APP_ID}
---
- launchApp:
    stopApp: false
- openLink: "${LINK_BASE}"
- runFlow:
    when:
      visible:
        id: "login-username"
    commands:
      - tapOn:
          id: "login-username"
      - inputText: ${KH_USER}
      - tapOn:
          id: "login-password"
      - inputText: ${KH_PASS}
      - hideKeyboard
      - tapOn:
          id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "sync-pill-.*"
    timeout: 60000
- takeScreenshot: "logged-in"
