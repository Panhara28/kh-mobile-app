# Generated by e2e/make_offline_flow.py: do not edit by hand.
# The phone must have been online for a few minutes before, with "All modules saved" in the sync sheet (flow 10).
# Needs: APP_ID, LINK_BASE (see e2e/README.md).
appId: ${APP_ID}
---
- launchApp:
    stopApp: false
- openLink: "${LINK_BASE}more"
- runFlow:
    when:
      visible:
        id: "sync-close"
    commands:
      - tapOn:
          id: "sync-close"
# opening the app starts the background sync again: wait until it has finished (the pill is green) before going offline
- extendedWaitUntil:
    visible:
      id: "sync-pill-ok"
    timeout: 300000
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: "sync-pill-offline"
    timeout: 60000
# --- tables
- runFlow:
    when:
      notVisible:
        id: "module-tables"
    commands:
      - scrollUntilVisible:
          element:
            id: "module-tables"
          direction: UP
          timeout: 8000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "module-tables"
    commands:
      - scrollUntilVisible:
          element:
            id: "module-tables"
          direction: DOWN
          timeout: 8000
          optional: true
- runFlow:
    when:
      visible:
        id: "module-tables"
    commands:
      - tapOn:
          id: "module-tables"
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: "offline-tables"
      - assertNotVisible:
          id: "error-network"
      - back
      - waitForAnimationToEnd:
          timeout: 2000
